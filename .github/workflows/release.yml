# Manual release from main only. Re-runs every gate on a clean checkout of the dispatched main
# commit, checks release readiness fail-closed (no pending changesets, no reused versions or tags),
# and creates DRAFT releases. A maintainer reviews and publishes each draft; nothing is public or
# tagged until then. No registry publication happens here.
name: Draft releases

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-releases
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          clean: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run check:root
      - run: bun run vet
      - run: bun run test:plain
      - run: bun run smoke:export "$RUNNER_TEMP/smoke"
      - name: Release readiness and plan (fails on pending changesets or reused versions)
        run: bun run release:plan "$RUNNER_TEMP/plan" --release --repo "$GITHUB_REPOSITORY"
      - run: bun scripts/draft-releases.ts "$RUNNER_TEMP/plan"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
